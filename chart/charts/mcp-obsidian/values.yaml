image:
  repository: lscr.io/linuxserver/obsidian
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# linuxserver environment variables
env:
  PUID: "1000"
  PGID: "1000"
  TZ: Europe/Berlin

service:
  # Local REST API plugin — only reachable on 127.0.0.1 inside the pod; not exposed
  guiPortHttp: 3000     # KasmVNC HTTP — use for kubectl port-forward bootstrap
  guiPortHttps: 3001    # KasmVNC HTTPS
  mcpPort: 8000         # mcp-obsidian sidecar

persistence:
  enabled: true
  # Use a storageClass with reclaimPolicy: Retain to protect vault data
  size: 10Gi
  storageClass: ""
  accessMode: ReadWriteOnce

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

# mcp-obsidian sidecar — shares the pod network so it can reach 127.0.0.1:27124
mcp:
  image:
    repository: ghcr.io/jakobkolb/mcp-obsidian
    tag: latest
    pullPolicy: IfNotPresent
  env:
    OBSIDIAN_HOST: "127.0.0.1"   # loopback — same pod network namespace
    OBSIDIAN_PORT: "27124"
    OBSIDIAN_PROTOCOL: https
  secretEnv: {}
  ingress:
    enabled: false    # umbrella chart owns all ingresses
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

nodeSelector: {}

tolerations: []

affinity: {}
