{{- $base := .Values.global.baseDomain -}}
{{- $issuer := .Values.global.clusterIssuer | default "letsencrypt-prod" -}}
{{- $authServerUrl := .Values.global.authServerUrl -}}
{{- $rn := .Release.Name -}}
{{- $wkName := printf "%s-well-known" $rn -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $wkName }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  default.conf: |
    server {
        listen 80;
        # RFC 9728: protected resource metadata
        # scopes_provided tells the client which scopes to request — must include
        # "openid" so Dex accepts the authorization request (it requires openid).
        location = /.well-known/oauth-protected-resource {
            default_type application/json;
            return 200 '{"resource":"https://$host","authorization_servers":["{{ $authServerUrl }}"],"scopes_provided":["openid","profile","email"]}';
        }
        # RFC 8414: auth server metadata for claude.ai MCP discovery
        location = /.well-known/oauth-authorization-server {
            default_type application/json;
            return 200 '{"issuer":"{{ $authServerUrl }}","authorization_endpoint":"{{ $authServerUrl }}/auth","token_endpoint":"{{ $authServerUrl }}/token","jwks_uri":"{{ $authServerUrl }}/keys","scopes_supported":["openid","profile","email","offline_access"],"response_types_supported":["code"],"grant_types_supported":["authorization_code","refresh_token"],"code_challenge_methods_supported":["S256"]}';
        }
        location / { return 404; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $wkName }}
  labels:
    app.kubernetes.io/name: {{ $wkName }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $wkName }}
  template:
    metadata:
      labels:
        app: {{ $wkName }}
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
          readinessProbe:
            httpGet:
              path: /.well-known/oauth-protected-resource
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: {{ $wkName }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $wkName }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selector:
    app: {{ $wkName }}
  ports:
    - port: 80
      targetPort: 80
---
{{/* /.well-known ingress per MCP hostname — no auth annotation */}}
{{- range $sub := list "obsidian" "calendar" }}
{{- $host := printf "%s.mcp.%s" $sub $base }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $rn }}-{{ $sub }}-well-known
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
  annotations:
    cert-manager.io/cluster-issuer: {{ $issuer }}
spec:
  ingressClassName: nginx
  tls:
    - hosts: [{{ $host }}]
      secretName: {{ $rn }}-{{ $sub }}-tls
  rules:
    - host: {{ $host }}
      http:
        paths:
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: {{ $wkName }}
                port:
                  number: 80
---
{{- end }}
{{/* /.well-known on auth host — longer prefix wins over the Dex ingress's /,
     so /.well-known/oauth-authorization-server routes here (RFC 8414 proxy)
     while all other auth.mcp.* paths still go to Dex */}}
{{- $authHost := printf "auth.mcp.%s" $base }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $rn }}-auth-well-known
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    cert-manager.io/cluster-issuer: {{ $issuer }}
spec:
  ingressClassName: nginx
  tls:
    - hosts: [{{ $authHost }}]
      secretName: {{ $rn }}-dex-tls
  rules:
    - host: {{ $authHost }}
      http:
        paths:
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: {{ $wkName }}
                port:
                  number: 80
