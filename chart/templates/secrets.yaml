{{- $s := .Values.global.secrets -}}
{{- with .Values.global.registry -}}
{{- if and .dockerConfigJson (not .existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: registry-creds
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .dockerConfigJson }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: dex-github-client
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  GITHUB_CLIENT_ID: {{ required "global.secrets.githubClientId is required" $s.githubClientId | quote }}
  GITHUB_CLIENT_SECRET: {{ required "global.secrets.githubClientSecret is required" $s.githubClientSecret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: dex-static-client
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  clientSecret: {{ required "global.secrets.dexClientSecret is required" $s.dexClientSecret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  client-id: "claude-mcp"
  client-secret: {{ required "global.secrets.dexClientSecret is required" $s.dexClientSecret | quote }}
  cookie-secret: {{ required "global.secrets.cookieSecret is required" $s.cookieSecret | quote }}
