apiVersion: v1
kind: Service
metadata:
  name: {{ include "obsidian.fullname" . }}
  labels:
    {{- include "obsidian.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.mcpPort }}
      targetPort: mcp
      protocol: TCP
      name: mcp
    - port: {{ .Values.service.guiPortHttp }}
      targetPort: gui-http
      protocol: TCP
      name: gui-http
    - port: {{ .Values.service.guiPortHttps }}
      targetPort: gui-https
      protocol: TCP
      name: gui-https
  selector:
    {{- include "obsidian.selectorLabels" . | nindent 4 }}
