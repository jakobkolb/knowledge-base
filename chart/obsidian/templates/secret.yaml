{{- if .Values.mcp.secretEnv }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "obsidian.fullname" . }}-mcp-secrets
  labels:
    {{- include "obsidian.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $val := .Values.mcp.secretEnv }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
