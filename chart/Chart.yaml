apiVersion: v2
name: knowledge-base
version: 0.1.0
description: MCP servers with OAuth authentication for cross-device knowledge base access
type: application
keywords:
  - mcp
  - obsidian
  - oauth
maintainers:
  - name: jakobkolb
dependencies:
  - name: mcp-server
    version: "0.13.0"
    repository: "oci://ghcr.io/jakobkolb/charts"
    alias: mcp-calendar
  - name: mcp-server
    version: "0.12.0"
    repository: "oci://ghcr.io/jakobkolb/charts"
    alias: mcp-obsidian
  - name: mcp-server
    version: "0.12.0"
    repository: "oci://ghcr.io/jakobkolb/charts"
    alias: mcp-whatsapp
  - name: mcp-server
    # First release with mcp-print; do not merge before v0.11.0 is tagged.
    version: "0.12.0"
    repository: "oci://ghcr.io/jakobkolb/charts"
    alias: mcp-print
  - name: api-gateway
    # 0.4.0 adds per-endpoint ingress annotations; 0.5.0 adds perEndpointConnectors (one refresh token per connector);
    # 0.6.0 restricts logins to an email allow-list (needs the Secret
    # oauth2-proxy-allowed-emails); 0.7.0 serves the OAuth endpoints over HTTPS
    # only (drops ssl-redirect=false), pins OpenResty, moves oauth2-proxy to
    # v7.15.6 and adds an opt-in NetworkPolicy (networkPolicy.enabled).
    version: "0.7.0"
    repository: "oci://ghcr.io/jakobkolb/charts"
    alias: api-gateway
