apiVersion: v2
name: knowledge-base
version: 0.1.0
description: MCP servers with OAuth authentication for cross-device knowledge base access
type: application
keywords:
  - mcp
  - obsidian
  - oauth
maintainers:
  - name: jakobkolb
dependencies:
  - name: mcp-server
    version: "0.8.1"
    repository: "oci://ghcr.io/jakobkolb/charts"
    alias: mcp-calendar
  - name: mcp-server
    version: "0.6.2"
    repository: "oci://ghcr.io/jakobkolb/charts"
    alias: mcp-example
  - name: mcp-server
    version: "0.9.0"
    repository: "oci://ghcr.io/jakobkolb/charts"
    alias: mcp-obsidian
  - name: mcp-server
    version: "0.7.0"
    repository: "oci://ghcr.io/jakobkolb/charts"
    alias: mcp-whisper
  - name: mcp-server
    version: "0.10.0"
    repository: "oci://ghcr.io/jakobkolb/charts"
    alias: mcp-whatsapp
  - name: mcp-server
    # First release with mcp-print; do not merge before v0.11.0 is tagged.
    version: "0.11.0"
    repository: "oci://ghcr.io/jakobkolb/charts"
    alias: mcp-print
  - name: api-gateway
    # 0.4.0 adds per-endpoint ingress annotations (mcp-whisper upload body
    # size); 0.5.0 adds perEndpointConnectors (one refresh token per connector).
    version: "0.5.0"
    repository: "oci://ghcr.io/jakobkolb/charts"
    alias: api-gateway
