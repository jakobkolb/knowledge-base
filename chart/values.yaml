global:
  # ── Edit these when moving to a different domain ─────────────────────────
  baseDomain: mcp.jakobjkolb.xyz  # MCP hosts become *.<baseDomain>; auth host becomes auth.<baseDomain>
  clusterIssuer: letsencrypt-prod

  # authServerUrl must equal https://auth.<baseDomain>
  # Set explicitly because third-party charts (Dex, oauth2-proxy) consume it
  # as a plain string — Helm values don't support self-referencing.
  authServerUrl: https://auth.mcp.jakobjkolb.xyz

  secrets: {}   # all secret fields populated in values.secret.yaml
  createSecrets: true   # set false for ArgoCD — pre-create secrets in cluster instead

  registry:
    existingSecret: ""    # name of a pre-existing imagePullSecret; skips Secret creation
    dockerConfigJson: ""  # base64 .dockerconfigjson; chart creates a Secret named registry-creds


# ── mcp-calendar (mcp-server chart aliased as mcp-calendar) ──────────────────
mcp-calendar:
  nameOverride: mcp-calendar    # makes service name <release>-mcp-calendar
  image:
    repository: ghcr.io/jakobkolb/mcp-calendar
    pullPolicy: IfNotPresent
  ingress:
    enabled: false    # umbrella chart owns all ingresses
  env:
    CALENDAR_CONFIG: /config/config.yaml
  configFile:
    enabled: true
    mountPath: /config/config.yaml
    content: ""       # set in values.secret.yaml
  # Calico/Felix periodically re-evaluates pod endpoint routes, briefly making
  # the pod IP unreachable. Raise failureThreshold so transient EINVAL errors
  # don't trigger a liveness kill and crash-loop the pod.
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 30
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 6


# ── mcp-example (smoketest / hello-world MCP server) ─────────────────────────
mcp-example:
  nameOverride: mcp-example    # makes service name <release>-mcp-example
  image:
    repository: ghcr.io/jakobkolb/example
    pullPolicy: Always
  ingress:
    enabled: false    # umbrella chart owns all ingresses
  env: {}
  configFile:
    enabled: false

mcp-obsidian:
  nameOverride: mcp-obsidian
  image:
    repository: ghcr.io/jakobkolb/mcp-obsidian
    pullPolicy: Always
  podSecurityContext:
    fsGroup: 1000    # shared GID for vault volume — both containers get write access
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
  ingress:
    enabled: false    # umbrella chart owns all ingresses
  service:
    port: 8080
  env:
    VAULT_PATH: /vault
    MCP_TRANSPORT: streamable-http
    MCP_PORT: "8080"
    LOG_LEVEL: INFO
  extraPersistentVolumeClaims:
    - name: obsidian-vault
      storageClassName: microk8s-hostpath
      accessModes:
        - ReadWriteOnce
      size: 10Gi
    - name: obsidian-headless-state
      storageClassName: microk8s-hostpath
      accessModes:
        - ReadWriteOnce
      size: 1Gi
  extraVolumeMounts:
    - name: vault
      mountPath: /vault
  extraVolumes:
    - name: vault
      persistentVolumeClaim:
        claimName: obsidian-vault
    - name: obsidian-headless-state
      persistentVolumeClaim:
        claimName: obsidian-headless-state
  # Calico/Felix periodically re-evaluates pod endpoint routes, briefly making
  # the pod IP unreachable. Raise failureThreshold so transient EINVAL errors
  # don't trigger a liveness kill and crash-loop the pod. Python handles SIGTERM
  # gracefully (uvicorn sets should_exit=True) so these restarts appear as exit 0.
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 30
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 6
  # Requires a secret named obsidian-headless-auth with keys:
  # email, password, vault, sync-password.
  extraContainers:
    - name: obsidian-headless
      image: node:22-bookworm-slim
      imagePullPolicy: IfNotPresent
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      command:
        - /bin/sh
        - -c
      args:
        - |
          set -eu

          mkdir -p "${VAULT_PATH}"
          mkdir -p "${HOME}"
          # Install to PVC-backed HOME so uid=1000 can write and it persists across restarts
          npm install -g --prefix "${HOME}" --cache /tmp/npm-cache obsidian-headless
          export PATH="${HOME}/bin:${PATH}"

          if ! ob sync-list-remote >/dev/null 2>&1; then
            ob login \
              --email "${OBSIDIAN_EMAIL}" \
              --password "${OBSIDIAN_PASSWORD}"
          fi

          if ! ob sync-status --path "${VAULT_PATH}" >/dev/null 2>&1; then
            ob sync-setup \
              --vault "${OBSIDIAN_VAULT}" \
              --path "${VAULT_PATH}" \
              --password "${OBSIDIAN_SYNC_PASSWORD}" \
              --device-name "${OBSIDIAN_DEVICE_NAME}"
          fi

          exec ob sync --path "${VAULT_PATH}" --continuous
      env:
        - name: VAULT_PATH
          value: /vault
        - name: HOME
          value: /obsidian-home
        - name: OBSIDIAN_DEVICE_NAME
          value: mcp-obsidian
        - name: OBSIDIAN_EMAIL
          valueFrom:
            secretKeyRef:
              name: obsidian-headless-auth
              key: email
        - name: OBSIDIAN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: obsidian-headless-auth
              key: password
        - name: OBSIDIAN_VAULT
          valueFrom:
            secretKeyRef:
              name: obsidian-headless-auth
              key: vault
        - name: OBSIDIAN_SYNC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: obsidian-headless-auth
              key: sync-password
      volumeMounts:
        - name: vault
          mountPath: /vault
        - name: obsidian-headless-state
          mountPath: /obsidian-home


# ── mcp-whisper (speech-to-text; Claude has no native transcription) ─────────
mcp-whisper:
  nameOverride: mcp-whisper
  image:
    repository: ghcr.io/jakobkolb/mcp-whisper
    pullPolicy: Always
  ingress:
    enabled: false    # umbrella chart owns all ingresses
  env:
    # "base" is the practical ceiling on Pi-class ARM cores — roughly real time
    # with int8. "small" and up fall well behind and starve the other pods.
    WHISPER_MODEL: base
    WHISPER_DEVICE: cpu
    WHISPER_COMPUTE_TYPE: int8
    # Match resources.limits.cpu; left at 0 CTranslate2 grabs every core on the
    # node and makes the rest of the cluster crawl during a transcription.
    WHISPER_CPU_THREADS: "3"
    WHISPER_MODEL_DIR: /models
    WHISPER_SPOOL_DIR: /spool
    # Keep in step with the proxy-body-size annotation below.
    WHISPER_MAX_AUDIO_BYTES: "67108864"
    LOG_LEVEL: INFO
  extraPersistentVolumeClaims:
    # Without this the pod re-downloads the weights from HuggingFace on every
    # restart — minutes of SD-card I/O before the first job can run.
    - name: whisper-models
      storageClassName: microk8s-hostpath
      accessModes:
        - ReadWriteOnce
      size: 5Gi
  extraVolumeMounts:
    - name: models
      mountPath: /models
    - name: spool
      mountPath: /spool
  extraVolumes:
    - name: models
      persistentVolumeClaim:
        claimName: whisper-models
    # Uploads are transient and deleted as soon as their job finishes, so they
    # do not need to survive a restart — but they do need a size cap so a
    # backlog cannot fill the node's root filesystem.
    - name: spool
      emptyDir:
        sizeLimit: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "3"
      memory: 2Gi
  # /health answers as soon as the process is up, including while the model is
  # still downloading — a probe failure there would restart the pod and throw
  # away the partial download.
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 30
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 6



# ── api-gateway (Dex + oauth2-proxy + well-known server) ─────────────────────
# NOTE for values.secret.yaml maintainers: dex and oauth2-proxy config previously
# lived at the top level (dex: / oauth2-proxy:).  They now nest under api-gateway:.
# Any overrides in values.secret.yaml must move accordingly, e.g.:
#   was:  dex.config.connectors[0].config.clientID
#   now:  api-gateway.dex.config.connectors[0].config.clientID
# The global.secrets.* keys are unchanged.
api-gateway:
  # MCP endpoints exposed by the api-gateway (auth + /.well-known ingress).
  # Add a new entry here whenever a new MCP server is added to the umbrella.
  mcpEndpoints:
    - subdomain: calendar
      service: mcp-calendar
    - subdomain: example
      service: mcp-example
    - subdomain: obsidian
      service: mcp-obsidian
      port: 8080
    - subdomain: whisper
      service: mcp-whisper
      annotations:
        # Audio is POSTed to /mcp/upload; nginx's 1m default would reject a
        # voice memo of any length. Keep at or above WHISPER_MAX_AUDIO_BYTES.
        nginx.ingress.kubernetes.io/proxy-body-size: "64m"
        # Uploading tens of MB over a slow uplink outlasts the 60s default.
        # Transcription itself is asynchronous and never holds a request open.
        nginx.ingress.kubernetes.io/proxy-read-timeout: "300"

  dex:
    config:
      # When changing domain: update issuer and connectors[0].config.redirectURI
      # to match global.authServerUrl (https://auth.<baseDomain>)
      issuer: https://auth.mcp.jakobjkolb.xyz
      storage:
        type: kubernetes
        config:
          inCluster: true
      web:
        http: 0.0.0.0:5556
      connectors:
        - type: github
          id: github
          name: GitHub
          config:
            clientID: $GITHUB_CLIENT_ID
            clientSecret: $GITHUB_CLIENT_SECRET
            redirectURI: https://auth.mcp.jakobjkolb.xyz/callback
      oauth2:
        skipApprovalScreen: true
      expiry:
        # Clients now hold a refresh token and renew silently, so the 72h
        # workaround for silent expiry is no longer needed.
        idTokens: 8h
        # Dex keeps a demoted signing key in the JWKS for idTokens after each
        # rotation, so signingKeys does not need to exceed idTokens.
        signingKeys: 12h
        refreshTokens:
          # Tolerate client retries and concurrent refreshes; outside this
          # window a replayed token is rejected and the client is logged out.
          reuseInterval: 30s
          # Re-authenticate only after a genuinely long idle gap.
          validIfNotUsedFor: 2160h
      staticClients:
        # Public client: authenticates with PKCE alone, matching what /register
        # hands out. A secret here makes Dex reject PKCE-only clients.
        - id: claude-mcp
          name: Claude MCP
          public: true
          redirectURIs:
            - https://claude.ai/api/mcp/auth_callback
    envFrom:
      - secretRef:
          name: dex-github-client   # secrets-bootstrap.sh (ArgoCD) or templates/secrets.yaml
      - secretRef:
          name: dex-static-client   # secrets-bootstrap.sh (ArgoCD) or templates/secrets.yaml

    ingress:
      enabled: false    # api-gateway subchart owns all ingresses
    serviceAccount:
      create: true
    rbac:
      create: true

  oauth2-proxy:
    extraArgs:
      provider: oidc
      # When changing domain: update oidc-issuer-url to match global.authServerUrl (https://auth.<baseDomain>)
      oidc-issuer-url: https://auth.mcp.jakobjkolb.xyz
      upstream: file:///dev/null      # external-auth mode only — no reverse proxying
      email-domain: "*"
      skip-jwt-bearer-tokens: "true"  # validate Bearer JWTs directly (no session cookie)
      skip-provider-button: "true"
      http-address: 0.0.0.0:4180
    config:
      existingSecret: oauth2-proxy      # created by secrets-bootstrap.sh (ArgoCD) or templates/secrets.yaml
    service:
      type: ClusterIP
      portNumber: 4180
    ingress:
      enabled: false    # internal only — nginx reaches it via cluster DNS
